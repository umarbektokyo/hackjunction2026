<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Earned Trust</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #e9e9e4; --panel: #f4f4f0; --ink: #111; --mute: #85857e; --line: #d3d3cc; --hot: #ff5a1f;
          --add: #e2ebd7; --add-hi: #bcd2a6; --del: #f6e1d8; --del-hi: #eab9a5;
          --kw: #3a5a8a; --str: #6a7a22; --type: #23676a; --num: #8a4f9a; --com: #9b9b93;
          --mono: ui-monospace, "SF Mono", Menlo, monospace; --sans: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--panel); color: var(--ink); font: 13px/1.5 var(--sans);
         display: grid; grid-template-columns: 270px minmax(0, 1fr) 350px; }
  button { all: unset; box-sizing: border-box; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
  .label { font: 10px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
  .hot { color: var(--hot); }

  /* status dots: one shape per state, explained by the legend */
  i.led { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--ink); border: 1.5px solid var(--ink); }
  i.held, i.notrun { background: none; }
  i.routed, i.failed { background: var(--hot); border-color: var(--hot); }
  i.weak { background: none; border-color: var(--hot); }
  i.decided { background: none; border: 0; width: 11px; height: 11px; border-radius: 0; position: relative; }
  i.decided::before { content: "✓"; position: absolute; top: -3px; left: 0; font: 600 12px var(--sans); font-style: normal; }

  /* left: what changed */
  nav { background: var(--bg); border-right: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  nav header { padding: 18px 18px 12px; } nav h1 { font: 400 15px/1.35 var(--sans); margin-top: 6px; }
  .progress { margin-top: 12px; font: 11px/1.6 var(--mono); color: var(--mute); } .progress b { color: var(--ink); font-weight: 500; }
  nav .list { overflow: auto; padding-bottom: 12px; }
  nav .group { padding: 14px 18px 4px; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 18px; font: 12px/1.5 var(--mono); }
  .row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row em { margin-left: auto; font-style: normal; color: var(--mute); font-size: 10px; white-space: nowrap; }
  .row:hover { background: #dfdfd9; } .row.sel { background: var(--ink); color: var(--panel); }
  .row.sel i.led:not(.routed) { border-color: var(--panel); } .row.sel i.cleared { background: var(--panel); }
  .row.sel i.decided::before { color: var(--panel); }
  .row.dim { opacity: .32; } .row.dim:hover { opacity: .7; }
  .legend { padding: 10px 18px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px;
            font: 10.5px/1.3 var(--sans); color: #55554f; }
  .legend span { display: flex; align-items: center; gap: 7px; }
  .merge { padding: 12px 18px 16px; border-top: 1px solid var(--line); }
  .merge .why { margin-top: 6px; display: grid; gap: 4px; }
  .merge .why button { font: 11.5px/1.35 var(--sans); color: #44443f; } .merge .why button:hover { color: var(--ink); text-decoration: underline; }
  .primary { display: block; text-align: center; color: var(--panel); background: var(--ink); padding: 9px 12px; border-radius: 5px; font: 12px var(--sans); }
  .primary:hover { background: #333; }

  /* middle: the editor */
  main { overflow: auto; background: var(--panel); min-width: 0; }
  .path { position: sticky; top: 0; z-index: 3; background: var(--panel); border-bottom: 1px solid var(--line);
          padding: 11px 20px; font: 12px var(--mono); display: flex; gap: 14px; align-items: center; }
  .path b { font-weight: 600; white-space: nowrap; }
  .path .file { color: var(--mute); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; }
  .path .tests { margin-left: auto; display: flex; gap: 5px; align-items: center; white-space: nowrap; color: var(--mute); }
  .path .tests.hot { color: var(--hot); }
  .nav-chg { display: flex; gap: 4px; align-items: center; white-space: nowrap; color: var(--mute); }
  .nav-chg button { border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; color: var(--ink); }
  .nav-chg button:hover { background: var(--ink); color: var(--panel); }
  .sec { padding: 22px 20px 8px; display: flex; gap: 10px; align-items: baseline; }
  .where { display: flex; gap: 10px; align-items: baseline; padding: 10px 20px 4px; font: 11px var(--mono); color: var(--mute); }
  .where button { color: var(--ink); border-bottom: 1px solid var(--ink); } .where b { color: var(--ink); font-weight: 500; }
  .quiet { padding: 2px 20px 0; font: 11px var(--mono); color: var(--mute); }
  main .end { height: 120px; }

  .code { font: 12px/1.7 var(--mono); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fbfbf8; }
  .ln { display: flex; }
  .ln .gut { display: flex; flex: none; background: #fbfbf8; color: var(--mute); user-select: none; }
  .ln .gut span { width: 42px; text-align: right; padding-right: 8px; }
  .ln .gut .sg { width: 22px; text-align: center; padding: 0; }
  .code.one .gut span:first-child { display: none; }
  .ln .tx { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 24px 0 calc(var(--i, 0ch) + 4ch + 4px); text-indent: -4ch; }
  .ln.add, .ln.add .gut { background: var(--add); } .ln.del, .ln.del .gut { background: var(--del); }
  .ln.hit .gut { box-shadow: inset -3px 0 0 var(--hot); }
  .ln.add .chg { background: var(--add-hi); border-radius: 2px; } .ln.del .chg { background: var(--del-hi); border-radius: 2px; }
  .kw { color: var(--kw); } .str { color: var(--str); } .type { color: var(--type); } .num { color: var(--num); }
  .com { color: var(--com); font-style: italic; }
  .name { color: var(--hot); font-weight: 600; }
  .ln.flash .gut, .ln.flash { animation: flash 1.2s; } @keyframes flash { from { background: #ffd9c9; } }

  /* right: the review and the decision */
  aside { border-left: 1px solid var(--line); background: var(--bg); overflow: auto; padding: 20px 20px 60px; }
  aside section { margin-top: 26px; }
  .state { display: flex; align-items: center; gap: 9px; font: 600 14px var(--sans); }
  .state.hot { color: var(--hot); }
  .summary { margin-top: 8px; font-size: 13.5px; line-height: 1.5; }
  .facts { margin-top: 10px; font-size: 12.5px; color: #4d4d47; }
  .card { border: 1.5px solid var(--hot); border-radius: 10px; padding: 16px; background: var(--panel); }
  .card.done { border-color: var(--ink); }
  .card h2 { font: 400 17px/1.35 var(--sans); margin: 8px 0 6px; }
  .card .hint { font-size: 12px; color: #5d5d57; }
  .opts { display: grid; gap: 8px; margin-top: 14px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid #bdbdb5; border-radius: 7px; font: 13px/1.4 var(--sans); background: #fff; }
  .opt::before { content: ""; flex: none; width: 13px; height: 13px; margin-top: 2px; border: 1.5px solid #999; border-radius: 50%; }
  .opt:hover { border-color: var(--ink); } .opt:hover::before { border-color: var(--ink); }
  .opt.busy { opacity: .6; pointer-events: none; } .opt.busy::before { border-color: var(--hot); border-style: dotted; }
  .chosen { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 10px 12px; border-radius: 7px; background: var(--ink); color: var(--panel); font: 13px/1.4 var(--sans); }
  .chosen::before { content: "✓"; font-weight: 700; }
  .who { margin-top: 8px; font-size: 12px; color: #5d5d57; }
  .after { display: flex; gap: 14px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .link { font-size: 12.5px; text-decoration: underline; color: #44443f; } .link:hover { color: var(--ink); }
  .err { margin-top: 10px; color: var(--hot); font-size: 12px; }
  details { border-top: 1px solid var(--line); } aside details:last-child { border-bottom: 1px solid var(--line); }
  .card details { margin-top: 14px; border: 0; }
  summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 12.5px; }
  summary::before { content: "▸"; color: var(--mute); font-size: 10px; } details[open] > summary::before { content: "▾"; }
  summary::-webkit-details-marker { display: none; }
  summary span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } summary em { margin-left: auto; font-style: normal; color: var(--mute); white-space: nowrap; font-size: 11px; }
  details > p { margin: 0 0 10px 18px; font-size: 12.5px; color: #4d4d47; }
  .suggest { display: flex; gap: 9px; margin: 0 0 10px 18px; font-size: 12px; color: #4d4d47; }
  .suggest::before { content: "+"; color: var(--mute); }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; transition: .2s;
           background: var(--ink); color: var(--panel); padding: 10px 14px; border-radius: 8px; font-size: 13px;
           display: flex; gap: 16px; align-items: center; z-index: 10; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { color: #ffb89c; text-decoration: underline; }
</style>

<nav>
  <header><div class="label" id="issue"></div><h1 id="title"></h1><div class="progress" id="progress"></div></header>
  <div class="list" id="list"></div>
  <div>
    <div class="legend">
      <span><i class="led cleared"></i>proven, safe to skip</span>
      <span><i class="led held"></i>not proven by a test</span>
      <span><i class="led routed"></i>needs your decision</span>
      <span><i class="led decided"></i>decided</span>
    </div>
    <div class="merge" id="merge"></div>
  </div>
</nav>
<main id="editor"></main>
<aside id="review"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const base = (path) => path.split("/").pop();
let S, sel, busy = null, error = null, chgAt = -1;

const units = () => S.dossier.units;
const unitOf = (file, name) => units().find((u) => u.file === file && u.name === name);
const title = (u) => u.name === "file header" ? "usings" : base(u.file).split(".")[0] === u.name ? u.name + "()" : u.name;
const isTest = (u) => u.name in S.dossier.tests;
const refusalsOf = (u) => S.dossier.refusals.filter((r) => u.refusals.includes(r.id));
const decided = (r) => S.decisions[r.id];
const openRefusals = () => S.dossier.refusals.filter((r) => !decided(r));
// What the reviewer sees: a routed unit whose questions are all answered counts as decided.
const state = (u) => u.status === "routed" && refusalsOf(u).every(decided) ? "decided" : u.status;
const MEANS = { cleared: "proven, safe to skip", held: "not proven by a test", routed: "needs your decision", decided: "decided" };

async function load() {
  S = await (await fetch("/api/state")).json();
  const linked = decodeURIComponent(location.hash.slice(1));          // #<unit id> opens that unit
  sel ??= units().some((u) => u.id === linked) ? linked : units().find((u) => u.status === "routed" && u.tier === "shipped").id;
  render();
}
async function post(item, decision) {
  busy = item + "|" + decision; error = null; renderReview();
  const res = await fetch("/api/decide", { method: "POST", body: JSON.stringify({ item, decision }) });
  busy = null;
  if (!res.ok) { error = await res.text(); return renderReview(); }
  S = await res.json();
  renderList(); renderReview();
  if (item === "MERGE") toast("Merged.");
  else if (decision === "reopen") toast("Decision reopened. Choose again.");
  else toast(`Recorded: “${decision}”`, () => post(item, "reopen"));
}
function toast(text, undo) {
  const t = $("#toast");
  t.innerHTML = `<span>${esc(text)}</span>${undo ? `<button>Undo</button>` : ""}`;
  if (undo) t.querySelector("button").onclick = () => { t.classList.remove("show"); undo(); };
  t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 6000);
}
function go(id) { sel = id; chgAt = -1; render(); $("#editor").scrollTop = 0; $("#review").scrollTop = 0; history.replaceState(null, "", "#" + id); }

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-item],[data-chg]");
  if (!t) return;
  if (t.dataset.item) post(t.dataset.item, t.dataset.decision);
  else if (t.dataset.chg) jumpChange(+t.dataset.chg);
  else go(t.dataset.go);
});
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "n" || e.key === "p") return jumpChange(e.key === "n" ? 1 : -1);
  const step = { ArrowDown: 1, ArrowUp: -1, j: 1, k: -1 }[e.key];
  if (!step) return;
  const order = [...document.querySelectorAll(".row")].map((r) => r.dataset.go);
  const next = order[order.indexOf(sel) + step];
  if (next) { e.preventDefault(); go(next); document.querySelector(".row.sel").scrollIntoView({ block: "nearest" }); }
});

function render() { renderList(); renderEditor(); renderReview(); }

// ---------- left: the list, progress, legend, merge ----------

// The test units that belong to a code unit: its tests and the helpers they call, transitively.
function testsOf(u) {
  const seen = new Set(), todo = u.covered_by.map((n) => units().find((x) => x.name === n && x.tier === "test")).filter(Boolean);
  for (const t of todo) {
    if (seen.has(t.id)) continue;
    seen.add(t.id);
    for (const c of t.calls) { const h = unitOf(c.file, c.member); if (h?.tier === "test") todo.push(h); }
  }
  return seen;
}
// Which test rows stay lit for the selection; null means no dimming (docs).
function related(u) {
  if (u.tier === "doc") return null;
  if (u.tier === "shipped") return testsOf(u);
  const owners = units().filter((x) => x.tier === "shipped" && testsOf(x).has(u.id));
  return new Set([u.id, ...owners.flatMap((x) => [...testsOf(x)])]);
}
const nextOpen = () => units().find((u) => refusalsOf(u).some((r) => !decided(r)) && u.id !== sel)
  || units().find((u) => refusalsOf(u).some((r) => !decided(r)));

function renderList() {
  const D = S.dossier, tests = Object.values(D.tests);
  $("#issue").textContent = `#${D.case.issue} · agent change`;
  $("#title").textContent = D.case.title;
  const proven = tests.filter((t) => t.proves_fix).length, ran = tests.some((t) => t.status !== "not run");
  $("#progress").innerHTML = `<b>${D.refusals.length - openRefusals().length} of ${D.refusals.length}</b> decisions made<br>` +
    (ran ? `<b>${proven} of ${tests.length}</b> tests prove the fix` : `tests not run on this machine`);

  const lit = related(units().find((u) => u.id === sel));
  $("#list").innerHTML = [["shipped", "code"], ["test", "tests"], ["doc", "docs"]].map(([tier, name]) =>
    `<div class="group label">${name}</div>` + units().filter((u) => u.tier === tier).map((u) => {
      const st = state(u), dim = tier === "test" && lit && !lit.has(u.id);
      return `<button class="row ${u.id === sel ? "sel" : ""} ${dim ? "dim" : ""}" data-go="${esc(u.id)}" title="${esc(MEANS[st])} · ${esc(u.file)}">
        <i class="led ${st}"></i><span>${esc(title(u))}</span><em>+${u.added}${u.removed ? " −" + u.removed : ""}</em></button>`;
    }).join("")).join("");

  const ap = D.owners.approver, done = S.decisions.MERGE;
  const open = nextOpen(), held = units().filter((u) => u.status === "held");
  const why = [open && `<button data-go="${esc(open.id)}">${openRefusals().length} decision${openRefusals().length > 1 ? "s" : ""} still open →</button>`,
    ...held.map((u) => `<button data-go="${esc(u.id)}">${esc(title(u))} is not proven by a test →</button>`)].filter(Boolean);
  $("#merge").innerHTML = done ? `<div class="state"><i class="led decided"></i>Merged by ${esc(ap.name)}</div>`
    : why.length ? `<div class="label">merge · ${esc(ap.name)} · blocked by</div><div class="why">${why.join("")}</div>`
    : `<button class="primary" data-item="MERGE" data-decision="approved">Merge as ${esc(ap.name)}</button>`;
}

// ---------- middle: code ----------

const KW = "abstract|as|async|await|base|bool|break|case|catch|char|class|const|continue|default|delegate|do|else|enum|event|false|finally|for|foreach|get|if|in|init|int|interface|internal|is|long|nameof|namespace|new|not|null|object|out|override|params|partial|private|protected|public|readonly|record|ref|return|sealed|set|static|string|struct|switch|this|throw|true|try|typeof|using|var|virtual|void|when|where|while|yield|and|or";
const TOK = new RegExp(`(//.*$|^\\s*\\*.*$|/\\*.*$)|(@?"(?:[^"\\\\]|\\\\.)*"?|'(?:[^'\\\\]|\\\\.)')|\\b(${KW})\\b|\\b(\\d[\\d_]*(?:\\.\\d+)?)\\b|\\b([A-Z]\\w*)\\b`, "g");
function tokens(text) {
  return [...text.matchAll(TOK)].map((m) => [m.index, m.index + m[0].length, m[1] ? "com" : m[2] ? "str" : m[3] ? "kw" : m[4] ? "num" : "type"]);
}
// Paint a line from overlapping ranges [start, end, class]: syntax, the changed part, the function's name.
function paint(text, ranges) {
  const cuts = [...new Set([0, text.length, ...ranges.flatMap(([a, b]) => [a, b])])].filter((x) => x >= 0 && x <= text.length).sort((a, b) => a - b);
  let out = "";
  for (let i = 0; i < cuts.length - 1; i++) {
    const [a, b] = [cuts[i], cuts[i + 1]], cls = ranges.filter(([s, e]) => s <= a && e >= b).map((r) => r[2]);
    const seg = esc(text.slice(a, b));
    out += cls.length ? `<span class="${[...new Set(cls)].join(" ")}">${seg}</span>` : seg;
  }
  return out;
}
const expand = (t) => t.replace(/\t/g, "    ");
// Leading indentation as tabs (drawn 2 columns wide), so deep nesting does not push code off screen.
const tabify = (t) => t.replace(/^(?: {4})+/, (m) => "\t".repeat(m.length / 4));
const dedent = (texts) => { const d = Math.min(...texts.filter((t) => t.trim()).map((t) => t.search(/\S/))); return (t) => t.slice(Number.isFinite(d) ? d : 0); };
function codeLine({ old = "", nu = "", sign = "", text, cls = "", md = false, chg = null, name = "", id = "" }) {
  const ranges = md ? [] : tokens(text);
  if (chg && chg[1] > chg[0]) ranges.push([chg[0], chg[1], "chg"]);
  if (name) for (const m of text.matchAll(new RegExp(`\\b${name}\\b(?=\\s*[(<])`, "g"))) ranges.push([m.index, m.index + m[0].length, "name"]);
  // Leading indentation becomes a hanging indent: wrapped parts of a long line stay under it, 4 columns in.
  const lead = text.match(/^[\t ]*/)[0], cols = [...lead].reduce((n, c) => n + (c === "\t" ? 2 : 1), 0), L = lead.length;
  const body = paint(text.slice(L), ranges.map(([a, b, c]) => [Math.max(0, a - L), Math.max(0, b - L), c]));
  return `<div class="ln ${cls}"${id ? ` id="${id}"` : ""}><span class="gut"><span>${old}</span><span>${nu}</span><span class="sg">${sign}</span></span><span class="tx" style="--i:${cols}ch">${body || " "}</span></div>`;
}
// The part of a removed/added pair that differs: common prefix and suffix cut, snapped to whole words.
function changed(a, b) {
  let p = 0, s = 0;
  while (p < a.length && p < b.length && a[p] === b[p]) p++;
  while (p > 0 && /\w/.test(a[p - 1])) p--;
  while (s < a.length - p && s < b.length - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
  while (s > 0 && /\w/.test(a[a.length - s])) s--;
  return p + s < 6 ? [null, null] : [[p, a.length - s], [p, b.length - s]];
}
// The whole unit as it reads after the change, with removed lines put back where they were.
function whole(u) {
  if (!u.body) return u.lines;
  const byNew = new Map(u.lines.filter((l) => l.kind !== "-").map((l) => [l.new, l])), before = new Map();
  let pend = [];
  for (const l of u.lines) { if (l.kind === "-") pend.push(l); else if (pend.length) { before.set(l.new, pend); pend = []; } }
  const rows = [];
  u.body.forEach((text, k) => { const n = u.start + k; rows.push(...(before.get(n) || []), byNew.get(n) || { kind: " ", new: n, text }); });
  rows.push(...pend);
  // Old line numbers for unchanged lines outside the hunks: old = new + (removed - added so far).
  const ref = u.lines.findIndex((l) => l.kind === " "), seen = u.lines.slice(0, ref);
  let delta = ref < 0 ? 0 : u.lines[ref].old - u.lines[ref].new - seen.filter((l) => l.kind === "-").length + seen.filter((l) => l.kind === "+").length;
  for (const r of rows) {
    if (r.kind === " ") r.old ??= r.new + delta;
    delta += r.kind === "-" ? 1 : r.kind === "+" ? -1 : 0;
  }
  return rows;
}
const jump = (file, name, text) => { const u = unitOf(file, name); return u ? `<button data-go="${esc(u.id)}">${esc(text)}</button>` : `<b>${esc(text)}</b>`; };

function renderEditor() {
  const D = S.dossier, u = units().find((x) => x.id === sel), md = u.file.endsWith(".md");
  const names = u.tier === "shipped" ? u.covered_by : isTest(u) ? [u.name] : [];
  const rows = whole(u).map((r) => ({ ...r, text: expand(r.text) })), cut = dedent(rows.map((r) => r.text));
  rows.forEach((r) => (r.text = md ? cut(r.text) : tabify(cut(r.text))));

  // Pair each run of removed lines with the added run after it; number the separate changes.
  const chg = [], starts = [];
  for (let i = 0; i < rows.length;) {
    let d = i; while (d < rows.length && rows[d].kind === "-") d++;
    let a = d; while (a < rows.length && rows[a].kind === "+") a++;
    for (let k = 0; k < Math.min(d - i, a - d); k++) [chg[i + k], chg[d + k]] = changed(rows[i + k].text, rows[d + k].text);
    if (a > i) { starts.push(i); i = a; } else i++;
  }
  const blocks = starts.filter((s, k) => k === 0 || rows.slice(starts[k - 1], s).some((r) => r.kind === " "));

  let tests = "";
  if (u.tier !== "doc") {
    const proven = names.filter((n) => D.tests[n].proves_fix).length, ran = names.some((n) => D.tests[n].status !== "not run");
    tests = `<span class="tests ${names.length || u.tier !== "shipped" ? "" : "hot"}">${names.map(testLed).join("")}
      ${names.length ? (ran ? `${proven} of ${names.length} prove${names.length > 1 ? "" : "s"} the fix` : `${names.length} test${names.length > 1 ? "s" : ""}, not run`)
        : u.tier === "shipped" ? "no test reaches this" : ""}</span>`;
  }
  const nav = blocks.length > 1 ? `<span class="nav-chg">${blocks.length} changes <button data-chg="-1" title="previous change (p)">↑</button><button data-chg="1" title="next change (n)">↓</button></span>`
    : blocks.length ? `<span class="nav-chg"><button data-chg="1" title="go to the change (n)">go to change ↓</button></span>` : "";
  let html = `<div class="path"><b>${esc(title(u))}</b><span class="file">${esc(u.file)}:${u.start}–${u.end}</span>${nav}${tests}</div>`;

  if (!md) {
    html += `<div class="sec label">called from</div>`;
    for (const c of u.callers) {
      const via = (c.callers || []).map((d) => `${d.member} ${base(d.file)}:${d.line}`).join(" · ");
      const ex = c.excerpt.map((l) => expand(l.text)), cutx = dedent(ex);
      html += `<div class="where">${jump(c.file, c.member, c.member)}<span>${esc(base(c.file))}:${c.line}${via ? " · reached from " + esc(via) : ""}</span></div>
        <div class="code one"><div class="rows">${c.excerpt.map((l, k) => codeLine({ nu: l.line, text: tabify(cutx(ex[k])), cls: l.line === c.line ? "hit" : "", name: u.name })).join("")}</div></div>`;
    }
    if (!u.callers.length) html += `<div class="quiet">${isTest(u) ? "run by the test runner" : u.name === "file header" ? "—" : "no caller found in this repo"}</div>`;
  }

  html += `<div class="sec label">${md ? "the whole section" : "the whole function"} · after the change</div><div class="code ${md ? "md" : ""}"><div class="rows">${rows.map((r, i) =>
    codeLine({ old: r.kind === "+" ? "" : r.old ?? "", nu: r.kind === "-" ? "" : r.new ?? "", sign: r.kind.trim(), text: r.text, md,
      cls: { "+": "add", "-": "del", " ": "" }[r.kind], chg: chg[i], id: blocks.includes(i) ? `chg${blocks.indexOf(i)}` : "" })).join("")}</div></div>`;

  if (!md) {
    html += `<div class="sec label">calls</div>`;
    for (const c of u.calls) html += `<div class="where">${jump(c.file, c.member, c.member)}<span>${esc(base(c.file))}:${c.decl} · called at line ${c.line}</span></div>
      <div class="code one"><div class="rows">${codeLine({ nu: c.decl, text: c.signature.trim(), cls: "hit", name: c.member })}</div></div>`;
    if (!u.calls.length) html += `<div class="quiet">nothing else in this repo</div>`;
  }
  $("#editor").innerHTML = html + `<div class="end"></div>`;
  renderEditor.count = blocks.length;
}
function jumpChange(step) {
  const n = renderEditor.count;
  if (!n) return;
  chgAt = Math.max(0, Math.min(n - 1, chgAt + step));
  const el = document.getElementById("chg" + chgAt);
  $("#editor").scrollTo({ top: el.offsetTop - 120, behavior: "smooth" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
// A test's dot: filled only when it passed with the change and failed without it.
function testLed(n) {
  const t = S.dossier.tests[n], cls = t.status === "passed" && !t.proves_fix ? "weak" : t.status.replace(/ /g, "");
  return `<i class="led ${cls}" title="${esc(`${n}: ${t.why}`)}"></i>`;
}

// ---------- right: the review and the decision ----------

function decisionCard(r) {
  const rec = decided(r), next = nextOpen();
  if (rec) return `<section class="card done">
      <div class="label">decided · ${esc(rec.by.name)} · ${rec.at.slice(11, 16)}</div>
      <h2>${esc(r.question)}</h2>
      <div class="chosen">${esc(rec.decision)}</div>
      <div class="who">Recorded with ${esc(rec.by.name)}'s name and the evidence it rests on.</div>
      <div class="after">${next ? `<button class="primary" data-go="${esc(next.id)}">Next open decision →</button>`
        : `<span class="facts">All decisions are made.</span>`}
        <button class="link" data-item="${r.id}" data-decision="reopen">Change decision</button></div>
    </section>`;
  return `<section class="card">
      <div class="label hot">needs a decision · ${esc(r.owner.name)}, ${esc(r.owner.role)}</div>
      <h2>${esc(r.question)}</h2>
      <p class="hint">The AI will not decide this. Pick one: it is recorded with ${esc(r.owner.name)}'s name, and you can change it later.</p>
      <div class="opts">${r.options.map((o) => `<button class="opt ${busy === r.id + "|" + o ? "busy" : ""}" data-item="${r.id}" data-decision="${esc(o)}">${esc(o)}</button>`).join("")}</div>
      ${error ? `<div class="err">Not recorded: ${esc(error)}</div>` : ""}
      <details><summary>Why the AI won't decide this</summary><p>${esc(r.why)}</p></details>
    </section>`;
}

function renderReview() {
  const D = S.dossier, u = units().find((x) => x.id === sel), st = state(u), rs = refusalsOf(u);
  const label = { cleared: "Proven · safe to skip", held: "Not proven by a test", routed: "Needs a decision", decided: "Decided" }[st];
  let html = `<div class="state ${st === "routed" ? "hot" : ""}"><i class="led ${st}"></i>${label}</div><p class="summary">${esc(u.summary)}</p>`;

  const names = u.tier === "shipped" ? u.covered_by : isTest(u) ? [u.name] : [];
  if (isTest(u)) html += `<p class="facts">This test ${esc(D.tests[u.name].why)}.</p>`;
  else if (u.tier === "shipped") {
    const proven = names.filter((n) => D.tests[n].proves_fix).length;
    html += `<p class="facts">${!names.length ? "No test reaches this function." :
      proven ? `${proven} of ${names.length} tests pass with the change and fail without it.` : `${names.length} tests reach it; none has proven the fix yet.`}</p>`;
  }
  for (const r of rs) html += `<section>${decisionCard(r)}</section>`;

  const notes = D.findings.filter((f) => f.unit === u.id);
  if (notes.length) html += `<section><div class="label">the AI noticed</div>${notes.map((f) => {
    const wanted = D.proposed_tests.filter((p) => p.for === f.id);
    return `<details><summary><span>${esc(f.title)}</span>${wanted.length ? `<em>${wanted.length} test${wanted.length > 1 ? "s" : ""} to add</em>` : ""}</summary>
      <p>${esc(f.text)}</p>${wanted.map((p) => `<div class="suggest">${esc(p.text)}</div>`).join("")}</details>`;
  }).join("")}</section>`;
  $("#review").innerHTML = html;
}
load();
</script>
</html>
