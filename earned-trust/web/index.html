<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Earned Trust</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #e9e9e4; --panel: #f4f4f0; --ink: #111; --mute: #8a8a84; --line: #d3d3cc; --hot: #ff5a1f;
          --add: #dde6d3; --del: #f2dbd1;
          --mono: ui-monospace, "SF Mono", Menlo, monospace; --sans: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--panel); color: var(--ink); font: 13px/1.5 var(--sans);
         display: grid; grid-template-columns: 290px minmax(0, 1fr) 370px; }
  .label { font: 10px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
  .hot { color: var(--hot); }
  button { all: unset; cursor: pointer; }
  i.led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none;
          background: var(--ink); border: 1.3px solid var(--ink); }
  i.held, i.notrun { background: none; } i.routed, i.failed { background: var(--hot); border-color: var(--hot); }
  i.suggested { background: none; border-style: dashed; border-color: var(--mute); }

  /* left: the changed functions, like a list of changed files */
  nav { background: var(--bg); border-right: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  nav header { padding: 18px 18px 14px; } nav h1 { font: 400 15px/1.35 var(--sans); margin-top: 6px; }
  nav .list { overflow: auto; padding-bottom: 12px; }
  nav .group { padding: 14px 18px 4px; }
  .row { display: flex; align-items: center; gap: 9px; width: 100%; padding: 5px 18px; font: 12px/1.5 var(--mono); }
  .row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row em { margin-left: auto; font-style: normal; color: var(--mute); font-size: 10px; white-space: nowrap; }
  .row:hover { background: #dfdfd9; } .row.sel { background: var(--ink); color: var(--panel); }
  .row.sel i.led:not(.routed) { border-color: var(--panel); } .row.sel i.cleared { background: var(--panel); }
  nav footer { padding: 12px 18px 16px; border-top: 1px solid var(--line); }
  .merge.go { display: block; text-align: center; color: var(--panel); background: var(--ink); padding: 8px; border-radius: 4px;
              font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; }

  /* middle: one editor buffer. Mentions above, the change, the calls it makes below */
  main { overflow: auto; background: var(--panel); min-width: 0; }
  .path { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
          padding: 12px 20px; font: 12px var(--mono); display: flex; gap: 14px; align-items: baseline; }
  .path b { font-weight: 600; } .path span { color: var(--mute); }
  .path .tests { margin-left: auto; display: flex; gap: 5px; align-items: center; white-space: nowrap; } .path .tests.hot { color: var(--hot); }
  .rule { padding: 22px 20px 6px 76px; display: flex; gap: 10px; align-items: baseline; }
  .where { display: flex; gap: 10px; align-items: baseline; padding: 10px 20px 3px 76px; font: 11px var(--mono); color: var(--mute); }
  .where button { color: var(--ink); border-bottom: 1px solid var(--ink); } .where b { color: var(--ink); font-weight: 500; }
  .code { font: 12px/1.6 var(--mono); }
  .code div { display: grid; grid-template-columns: 56px 20px minmax(0, 1fr); padding-right: 20px; }
  .code .n { color: var(--mute); text-align: right; user-select: none; }
  .code .s { text-align: center; color: var(--mute); user-select: none; }
  .code .t { white-space: pre-wrap; word-break: break-all; }
  .code .add { background: var(--add); } .code .del { background: var(--del); color: #7a5a4e; }
  .code .hit .t { box-shadow: inset 2px 0 0 var(--hot); padding-left: 8px; margin-left: -10px; }
  .code mark { background: none; color: var(--hot); font-weight: 600; }
  .quiet { padding: 4px 20px 0 76px; font: 11px var(--mono); color: var(--mute); }
  main .end { height: 80px; }

  /* right: the review of this function and its tests */
  aside { border-left: 1px solid var(--line); background: var(--bg); overflow: auto; padding: 18px 20px 40px; }
  aside section { margin-top: 24px; } aside p { margin-top: 8px; }
  .ask { border: 1.5px solid var(--hot); border-radius: 8px; padding: 13px 14px; background: var(--panel); }
  .ask q { display: block; font: 400 16px/1.35 var(--sans); margin: 6px 0 4px; quotes: none; }
  .ask button { display: block; font: 11px/1.35 var(--mono); padding: 7px 10px; margin-top: 8px;
                border: 1px solid var(--ink); border-radius: 4px; }
  .ask button:hover { background: var(--ink); color: var(--panel); }
  .done { font: 12px/1.5 var(--mono); margin-top: 10px; }
  .small { font-size: 12.5px; color: #4d4d47; } .small b { font-weight: 500; color: var(--ink); }
  .bar { display: flex; gap: 3px; margin: 8px 0 6px; } .bar i { flex: 1; height: 5px; border-radius: 3px; border: 1.3px solid var(--ink); }
  .bar i.passed { background: var(--ink); } .bar i.failed { background: var(--hot); border-color: var(--hot); }
  details { border-top: 1px solid var(--line); } details:last-of-type { border-bottom: 1px solid var(--line); }
  summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 9px; padding: 7px 0; font: 11px/1.5 var(--mono); }
  summary::-webkit-details-marker { display: none; }
  summary span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } summary em { margin-left: auto; font-style: normal; color: var(--mute); white-space: nowrap; }
  details .code { font-size: 10.5px; background: var(--panel); border-radius: 6px; padding: 8px 0; margin-bottom: 10px; max-height: 320px; overflow: auto; }
  details .code div { grid-template-columns: 34px 8px minmax(0, 1fr); padding-right: 8px; }
  details .open { display: inline-block; font: 10px var(--mono); border-bottom: 1px solid var(--ink); margin: 0 0 10px; }
  .suggest { display: flex; gap: 9px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 12px; color: #4d4d47; }
  .suggest i { margin-top: 5px; }
</style>

<nav>
  <header><div class="label" id="issue"></div><h1 id="title"></h1></header>
  <div class="list" id="list"></div>
  <footer id="merge"></footer>
</nav>
<main id="editor"></main>
<aside id="review"></aside>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const base = (path) => path.split("/").pop();
let S, sel;

const units = () => S.dossier.units;
const unitOf = (file, name) => units().find((u) => u.file === file && u.name === name);
const title = (u) => u.name === "file header" ? "usings" : base(u.file).split(".")[0] === u.name ? u.name + "()" : u.name;
const refusal = (u) => S.dossier.refusals.find((r) => u.refusals.includes(r.id));
const isTest = (u) => u.name in S.dossier.tests;

async function load() {
  S = await (await fetch("/api/state")).json();
  sel ??= units().find((u) => u.status === "routed" && u.tier === "shipped").id;
  render();
}
async function decide(item, decision) {
  S = await (await fetch("/api/decide", { method: "POST", body: JSON.stringify({ item, decision }) })).json();
  render();
}
function go(id) { sel = id; render(); $("#editor").scrollTop = 0; $("#review").scrollTop = 0; }
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-item]");
  if (t?.dataset.item) decide(t.dataset.item, t.dataset.decision);
  else if (t) go(t.dataset.go);
});
document.addEventListener("keydown", (e) => {                   // up / down walk the list, like an editor's file tree
  const step = { ArrowDown: 1, ArrowUp: -1, j: 1, k: -1 }[e.key];
  if (!step) return;
  const order = [...document.querySelectorAll(".row")].map((r) => r.dataset.go);
  const next = order[order.indexOf(sel) + step];
  if (next) { e.preventDefault(); go(next); document.querySelector(".row.sel").scrollIntoView({ block: "nearest" }); }
});

function render() { renderList(); renderEditor(); renderReview(); }

function renderList() {
  const D = S.dossier;
  $("#issue").textContent = `#${D.case.issue} · agent change`;
  $("#title").textContent = D.case.title;
  $("#list").innerHTML = [["shipped", "code"], ["test", "tests"], ["doc", "docs"]].map(([tier, name]) =>
    `<div class="group label">${name}</div>` + units().filter((u) => u.tier === tier).map((u) =>
      `<button class="row ${u.id === sel ? "sel" : ""}" data-go="${esc(u.id)}" title="${esc(u.file)}">
         <i class="led ${u.status}"></i><span>${esc(title(u))}</span><em>+${u.added}${u.removed ? " −" + u.removed : ""}</em></button>`).join("")).join("");
  const open = D.refusals.filter((r) => !S.decisions[r.id]).length, held = D.summary.held, ap = D.owners.approver;
  const wait = [open && `${open} decision${open > 1 ? "s" : ""}`, held && "a test run"].filter(Boolean).join(" and ");
  $("#merge").innerHTML = S.decisions.MERGE ? `<div class="label">merged · ${esc(ap.name)}</div>`
    : wait ? `<div class="label">merge · ${esc(ap.name)}<br>waits for ${wait}</div>`
    : `<button class="merge go" data-item="MERGE" data-decision="approved">merge · ${esc(ap.name)}</button>`;
}

function line(no, sign, text, cls = "", name = "") {
  let t = esc(text) || " ";
  if (name) t = t.replace(new RegExp(`\\b${name}\\b(?=\\s*[(<])|\\bnew(?=\\()`, "g"), "<mark>$&</mark>");
  return `<div class="${cls}"><span class="n">${no}</span><span class="s">${sign}</span><span class="t">${t}</span></div>`;
}
const dedent = (rows) => { const d = Math.min(...rows.filter((r) => r.text.trim()).map((r) => r.text.search(/\S/))); return (t) => t.slice(d); };
const jump = (file, name, text) => { const u = unitOf(file, name); return u ? `<button data-go="${esc(u.id)}">${esc(text)}</button>` : `<b>${esc(text)}</b>`; };

function renderEditor() {
  const u = units().find((x) => x.id === sel), code = !u.file.endsWith(".md");
  const names = u.tier === "shipped" ? u.covered_by : isTest(u) ? [u.name] : [], D = S.dossier;
  const ran = names.filter((n) => ["passed", "failed"].includes(D.tests[n].status)).length;
  const strip = u.tier === "doc" ? "" : `<span class="tests ${names.length ? "" : "hot"}">${names.map((n) =>
    `<i class="led ${D.tests[n].status.replace(" ", "")}" title="${esc(n)}: ${D.tests[n].status}"></i>`).join("")}
    ${names.length ? `${ran} of ${names.length} test${names.length > 1 ? "s" : ""} run` : u.tier === "shipped" ? "no test reaches this" : ""}</span>`;
  let html = `<div class="path"><b>${esc(title(u))}</b><span>${esc(u.file)}:${u.start}–${u.end}</span>${strip}</div>`;

  if (code) {
    html += `<div class="rule label">mentions · where it is called from</div>`;
    for (const c of u.callers) {
      const cut = dedent(c.excerpt), via = (c.callers || []).map((d) => `${d.member} ${base(d.file)}:${d.line}`).join(" · ");
      html += `<div class="where">${jump(c.file, c.member, c.member)}<span>${esc(base(c.file))}:${c.line}${via ? " · reached from " + esc(via) : ""}</span></div>
        <div class="code">${c.excerpt.map((l) => line(l.line, "", cut(l.text), l.line === c.line ? "hit" : "", u.name)).join("")}</div>`;
    }
    if (!u.callers.length) html += `<div class="quiet">${isTest(u) ? "run by the test runner" : u.name === "file header" ? "—" : "no caller found in this repo"}</div>`;
  }

  const cut = dedent(u.lines);
  html += `<div class="rule label">change</div><div class="code">${u.lines.map((l, i) => {
    const no = l.new ?? l.old, prev = i && (u.lines[i - 1].new ?? u.lines[i - 1].old);
    return (i && no - prev > 1 ? line("⋯", "", "") : "") + line(no, l.kind.trim(), cut(l.text), { "+": "add", "-": "del", " ": "" }[l.kind]);
  }).join("")}</div>`;

  if (code) {
    html += `<div class="rule label">calls · what it calls</div>`;
    for (const c of u.calls) html += `<div class="where">${jump(c.file, c.member, c.member)}<span>${esc(base(c.file))}:${c.decl} · called at line ${c.line}</span></div>
      <div class="code">${line(c.decl, "", c.signature, "hit", c.member)}</div>`;
    if (!u.calls.length) html += `<div class="quiet">nothing else in this file</div>`;
  }
  $("#editor").innerHTML = html + `<div class="end"></div>`;
}

function testRow(name) {
  const t = units().find((x) => x.name === name), st = S.dossier.tests[name].status, cut = dedent(t.lines);
  return `<details><summary><i class="led ${st.replace(" ", "")}"></i><span>${esc(name)}</span><em>${esc(st)}</em></summary>
    <div class="code">${t.lines.map((l) => line(l.new, "", cut(l.text))).join("")}</div>
    <button class="open" data-go="${esc(t.id)}">open this test</button></details>`;
}

function renderReview() {
  const D = S.dossier, u = units().find((x) => x.id === sel), r = refusal(u);
  const says = { cleared: "checked · safe to skip", held: "waiting for a test run", routed: `needs a decision · ${r?.owner.name}` }[u.status];
  let html = `<div class="label ${u.status === "routed" ? "hot" : ""}">${esc(says)}</div><p>${esc(u.summary)}</p>`;

  if (r) {
    const rec = S.decisions[r.id];
    html += `<section class="ask"><div class="label hot">the AI will not decide this<br>${esc(r.owner.name)} · ${esc(r.owner.role)}</div>
      <q>${esc(r.question)}</q><p class="small">${esc(r.why)}</p>
      ${rec ? `<div class="done">✓ ${esc(rec.decision)}<br><span style="color:var(--mute)">${esc(rec.by.name)} · ${rec.at.slice(11, 16)}</span></div>` : ""}
      ${r.options.filter((o) => o !== rec?.decision).map((o) => `<button data-item="${r.id}" data-decision="${esc(o)}">${esc(o)}</button>`).join("")}</section>`;
  }

  const notes = D.findings.filter((f) => f.unit === u.id);
  if (u.tier === "shipped") {
    const st = u.covered_by.map((n) => D.tests[n].status), ran = st.filter((s) => s === "passed" || s === "failed").length;
    const wanted = D.proposed_tests.filter((p) => notes.some((f) => f.id === p.for));
    html += `<section><div class="label">tests for this function · ${ran} of ${st.length} run</div>
      <div class="bar">${st.map((s) => `<i class="${s}"></i>`).join("")}</div>
      ${u.covered_by.map(testRow).join("") || `<p class="small hot">No test reaches this function.</p>`}
      ${wanted.map((p) => `<div class="suggest"><i class="led suggested"></i><span>${esc(p.text)}</span></div>`).join("")}</section>`;
  } else if (isTest(u)) {
    const st = D.tests[u.name].status, targets = units().filter((x) => (x.covered_by || []).includes(u.name));
    html += `<section><div class="label">this test · ${esc(st)}</div><div class="bar"><i class="${st}"></i></div>
      <p class="small">${esc(D.tests[u.name].why)}</p></section>
      <section><div class="label">exercises</div>${targets.map((x) =>
        `<button class="row" style="padding:5px 0" data-go="${esc(x.id)}"><i class="led ${x.status}"></i><span>${esc(title(x))}</span></button>`).join("")}</section>`;
  }
  if (notes.length) html += `<section><div class="label">the AI noticed</div>${notes.map((f) =>
    `<p class="small"><b>${esc(f.title)}.</b> ${esc(f.text)}</p>`).join("")}</section>`;

  $("#review").innerHTML = html;
}
load();
</script>
</html>
